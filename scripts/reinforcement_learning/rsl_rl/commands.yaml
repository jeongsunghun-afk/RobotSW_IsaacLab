# commands.yaml
# `report.py`를 실행하기 위한 여러 환경별 커맨드 설정 파일입니다.
# 파일 구성을 참고하여 필요한 만큼 항목을 복사/수정하여 사용하세요.

Go2WTW:
  env_0:
    type: "go2wtw"
    gait: "trotting"
    lin_vel_x: 0.5
    lin_vel_y: 0.0
    yaw_vel: 0.0
  env_4:
    type: "go2wtw"
    gait: "trotting"
    lin_vel_x: 0.5
    lin_vel_y: 0.0
    yaw_vel: 0.5
  env_1:
    type: "go2wtw"
    gait: "trotting"
    lin_vel_x: 1.0
    lin_vel_y: 0.0
    yaw_vel: 0.0
  env_2:
    type: "go2wtw"
    gait: "trotting"
    lin_vel_x: 0.5
    lin_vel_y: 0.0
    yaw_vel: 0.0
  env_3:
    type: "go2wtw"
    gait: "trotting"
    lin_vel_x: 2.0
    lin_vel_y: 0.0
    yaw_vel: 0.0

Go2Neck:
